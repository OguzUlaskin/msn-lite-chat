<!DOCTYPE html>
<html>
<head>
    <title>Kayıt Ol - MSN Lite</title>
</head>
<body>
    <h2>Kayıt Ol</h2>
    <form id="registerForm" enctype="multipart/form-data" method="post" action="/api/Account/register">
        <label>Kullanıcı Adı:</label>
        <input type="text" name="username"><br>
        <label>Şifre:</label>
        <input type="password" name="password"><br>
        <label>Profil Fotoğrafı:</label>
        <input type="file" name="profileImage"><br>
        <button type="submit">Kayıt Ol</button>
    </form>
    <p>Zaten hesabın var mı? <a href="login.html">Giriş Yap</a></p>
</body>
</html>
